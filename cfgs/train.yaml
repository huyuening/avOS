WANDB_API_KEY: null

SEED: 0

DATASET:
  OPTIMIZED_PATH: converted-dataset/waymo-open
  TRAINVAL_PATH: datasets/trainval_dataset/waymo-open

DATALIST:
  PATH: data/train_data
  NAME:
    ALL: all.txt
    TRAIN: train.txt
    VAL: val.txt
    TEST: val.txt

MAX_TIMESTEP: 50

OBJECT_RANGE: 50
MAP_RANGE: 50

THRES: 3.5
MAX_OBJECT_NUM: 96

LANE_NUM: 328
LINE_NUM: 192
EDGE_NUM: 128
OTHER_NUM: 32

BASE_DIST: 10
BASE_SPEED: 2.5
BASE_LENGTH: 1

DATA:
  ABLATION: false
  ABLATION_VARIABLE_START_IDX: none
  ABLATION_VARIABLE_END_IDX: none
  ABLATION_FIELD: "none"
  OBJECT_CODE_DIM: 17

  SPLIT_OBJECT_INPUT: true
  OBJECT_POSE_DIM: 4
  OBJECT_CODE_SPLIT_DIM: 13
  NUM_OBJ_TYPES: 5
  NUM_ACTION_TRENDS: 4
  NUM_ACTION_TYPES: 11
  CODE_EMB_DIM: 32

PREPROCESS:
  ACTION_STEP: 5
  USE_ACTION_FROM_DATA: false
  MAP: true

MODEL:
  HIDDEN_DIM: 256
  MLP_DIM: 512
  ATTR_GMM_K: 5
  M_K: 6
  STEP: 49

  POS_ENCODING_DIM: 28
  QUERY_NUM: 96

  NHEAD: 4
  NLAYER: 1
  FF_DIM: 2048
  DROPOUT: 0.1
  ACTIVATION: "gelu"

  USE_ONE_GMM: true

TRAIN:
  BATCH_SIZE: 256
VAL:
  BATCH_SIZE: 256
TEST:
  BATCH_SIZE: 2445

DATALOADER:
  NUM_WORKERS: 4
  PREFETCH_FACTOR: 2
  PIN_MEMORY: true
  PERSISTENT_WORKERS: false

EVAL:
  TORCH_COMPILE: false

LEARNING_RATE: 0.0004
NUM_EPOCHS: 100

LOSS:
  USE_ALL_LOCATIONS: false
  INIT_LOSS_WEIGHT: 1.0
  FUTURE_LOSS_WEIGHT: 10.0

METRICS:
  MMD:
    KERNEL_MUL: 1.0
    KERNEL_NUM: 1
    FIX_SIGMA: null

MODE:
  ONLY_LANGUAGE_INPUT: false  # else: fixed demand by report + variable demand by user
